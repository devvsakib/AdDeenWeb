<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdDeenWeb - Coming Soon</title>
    <!-- Premium Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Hind Siliguri', sans-serif;
            background-color: #f8fafc; /* Soft off-white */
            color: #1e293b; /* Deep slate gray */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            background: #ffffff;
            max-width: 640px;
            width: 100%;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02);
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .logo {
            font-size: 2rem;
            font-weight: 600;
            color: #0f172a;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .logo span {
            color: #0d9488; /* Elegant Teal */
        }

        .tagline {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 40px;
        }

        /* Minimalist Quran Verse */
        .quran-box {
            margin-bottom: 40px;
            padding: 0 10px;
        }

        .arabic {
            font-family: 'Inter', sans-serif;
            font-size: 1.5rem;
            color: #0d9488;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .translation {
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.6;
            font-style: italic;
        }

        .divider {
            height: 1px;
            background: #e2e8f0;
            width: 60px;
            margin: 30px auto;
        }

        /* Goals/Features */
        .status-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: #334155;
            margin-bottom: 16px;
        }

        .tags-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 45px;
            flex-wrap: wrap;
        }

        .tag {
            background: #f1f5f9;
            color: #475569;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .tag:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        /* Sleek Countdown */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 40px;
        }

        .time-group {
            text-align: center;
            min-width: 60px;
        }

        .time-num {
            font-size: 2.25rem;
            font-weight: 300;
            color: #0f172a;
            display: block;
            line-height: 1;
            margin-bottom: 6px;
            letter-spacing: -1px;
        }

        .time-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .footer {
            font-size: 0.8rem;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        /* Responsive padding adjustments */
        @media (max-width: 480px) {
            .card {
                padding: 40px 20px;
            }
            .countdown {
                gap: 16px;
            }
            .time-num {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">AdDeen<span>Web</span></div>
        <p class="tagline">আপনার ইসলামিক জ্ঞানের বিশ্বস্ত মাধ্যম</p>

        <div class="quran-box">
            <div class="arabic">وَقُلْ رَبِّ زِدْنِي عِلْمًا</div>
            <div class="translation">"বলুন, হে আমার পালনকর্তা! আমার জ্ঞান বৃদ্ধি করুন।" <br> (সূরা তহা, আয়াত: ১১৪)</div>
        </div>

        <div class="divider"></div>

        <p class="status-text">আমাদের ওয়েবসাইটটি তৈরি হচ্ছে</p>
        <div class="tags-container">
            <span class="tag">আর্টিকেল</span>
            <span class="tag">ইসলামিক বই</span>
            <span class="tag">ফতোয়া ও মাসয়ালা</span>
        </div>

        <!-- Minimal Countdown -->
        <div class="countdown">
            <div class="time-group">
                <span class="time-num" id="days">00</span>
                <span class="time-label">Days</span>
            </div>
            <div class="time-group">
                <span class="time-num" id="hours">00</span>
                <span class="time-label">Hours</span>
            </div>
            <div class="time-group">
                <span class="time-num" id="mins">00</span>
                <span class="time-label">Mins</span>
            </div>
            <div class="time-group">
                <span class="time-num" id="secs">00</span>
                <span class="time-label">Secs</span>
            </div>
        </div>

        <div class="footer">
            &copy; 2026 AdDeenWeb. Built with purpose.
        </div>
    </div>

    <script>
        const targetDate = new Date(2026, 8, 1).getTime(); 

        const updateCountdown = () => {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference < 0) {
                document.querySelector(".countdown").innerHTML = "<p style='color:#0d9488; font-weight:500;'>আলহামদুলিল্লাহ, আমরা এখন লাইভে আছি!</p>";
                clearInterval(intervalId);
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("mins").innerText = mins.toString().padStart(2, '0');
            document.getElementById("secs").innerText = secs.toString().padStart(2, '0');
        };

        const intervalId = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
